name: Deploy to GitHub Pages

# Builds the love.js web bundle and deploys dist/web to GitHub Pages.
# One-time setup, not covered by this file:
#   1. Repo Settings -> Pages -> Source: "GitHub Actions".
#   2. DNS for g-copy.gand.games: CNAME record pointing at gandtr.github.io.
# The CNAME file inside dist/web (written by build_web.sh) makes Pages serve
# the custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://g-copy.gand.games
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Install test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          npx playwright install --with-deps chromium

      - name: Test game and save bridge
        run: npm test

      - name: Build web
        run: bash build_web.sh

      - name: Test browser playthroughs and responsive layout
        run: |
          python3 serve.py > /tmp/g-copy-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
