<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>G COPY — Gand Games</title>

    <!-- Load custom style sheet -->
    <link rel="stylesheet" type="text/css" href="theme/love.css">
  </head>
  <body>
    <div class="game-wrapper">
      <h1>G COPY</h1>
      <div class="canvas-container">
        <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
        <canvas tabindex="0" aria-label="G Copy game" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="status-dot"></span>
          <span id="statusText">INITIALIZING...</span>
        </div>
        <div class="toolbar-right">
          <button onclick="goFullScreen();">FULLSCREEN</button>
        </div>
      </div>
    </div>

    <script type='text/javascript'>
      async function goFullScreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.querySelector('.game-wrapper').requestFullscreen();
        } catch (error) {
          statusText.textContent = 'FULLSCREEN UNAVAILABLE';
        }
      }
      function resizeGame() {
        if (!Module.setCanvasSize) return;
        var area = document.querySelector('.canvas-container');
        var ratio = window.devicePixelRatio || 1;
        var width = Math.max(1, Math.round(area.clientWidth * ratio));
        var height = Math.max(1, Math.round(area.clientHeight * ratio));
        if (Module.canvas.width !== width || Module.canvas.height !== height) {
          Module.setCanvasSize(width, height);
        }
      }
      new ResizeObserver(resizeGame).observe(document.querySelector('.canvas-container'));
      window.addEventListener('resize', resizeGame);
      document.addEventListener('fullscreenchange', resizeGame);
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;

        // Dark background
        loadingContext.fillStyle = "#05090a";
        loadingContext.fillRect(0, 0, canvas.width, canvas.height);

        // Grid pattern
        loadingContext.strokeStyle = "rgba(60, 110, 120, 0.15)";
        loadingContext.lineWidth = 1;
        for (var x = 0; x < canvas.width; x += 32) {
          loadingContext.beginPath();
          loadingContext.moveTo(x, 0);
          loadingContext.lineTo(x, canvas.height);
          loadingContext.stroke();
        }
        for (var y = 0; y < canvas.height; y += 32) {
          loadingContext.beginPath();
          loadingContext.moveTo(0, y);
          loadingContext.lineTo(canvas.width, y);
          loadingContext.stroke();
        }

        // Loading text
        loadingContext.font = 'bold 16px "Share Tech Mono", "Courier New", monospace';
        loadingContext.textAlign = 'center';
        loadingContext.fillStyle = "#8fb8bf";
        loadingContext.fillText(text.toUpperCase(), canvas.width / 2, canvas.height / 2);

        // Title
        loadingContext.font = 'bold 28px "Share Tech Mono", "Courier New", monospace';
        loadingContext.fillStyle = "#59c7d1";
        loadingContext.shadowColor = "rgba(89, 199, 209, 0.5)";
        loadingContext.shadowBlur = 15;
        loadingContext.fillText("G COPY", canvas.width / 2, canvas.height / 2 - 60);
        loadingContext.shadowBlur = 0;

        // Subtitle
        loadingContext.font = '12px "Share Tech Mono", "Courier New", monospace';
        loadingContext.fillStyle = "#55777d";
        loadingContext.fillText("A GAND GAMES RELEASE", canvas.width / 2, canvas.height / 2 + 40);
      }

      var statusText = document.getElementById('statusText');

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        if (e.key === 'F11') {
          e.preventDefault();
          if (!e.repeat) goFullScreen();
          e.stopImmediatePropagation();
          return;
        }
        if (e.key === 'Tab' && document.activeElement === Module.canvas) e.preventDefault();
        // space and arrow keys
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, true);

      document.getElementById('canvas').addEventListener('pointerdown', function() {
        this.focus();
      });

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 67108864,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
            if (statusText) statusText.textContent = text.toUpperCase();
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
            if (statusText) statusText.textContent = 'ACTIVE';
            requestAnimationFrame(resizeGame);
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus('Exception thrown, see JavaScript console');
        if (statusText) statusText.textContent = 'ERROR';
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) {
        Love(Module);
      }
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
    <footer>
      <p>A <a href="https://gand.games">Gand Games</a> release &bull; Built with <a href="https://github.com/Davidobot/love.js">love.js</a> &bull; Copy, verify, deliver</p>
    </footer>
  </body>
</html>
